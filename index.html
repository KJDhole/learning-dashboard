<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glenn · Learning OS</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><div><p class="eyebrow">LEARNING OS</p><h1>Glenn's Learning Dashboard</h1><p class="muted">Build · Learn · Review · Repeat</p></div><div id="today" class="date"></div></header><section class="stats"><article><span>今日学习</span><strong id="todayTime">0m</strong></article><article><span>本周学习</span><strong id="weekTime">0m</strong></article><article><span>连续学习</span><strong>🔥 <b id="streak">0</b> Days</strong><small>Best <b id="bestStreak">0</b> Days</small></article><article><span>本周学习天数</span><strong id="weekDays">0 / 7</strong></article></section><section class="panel"><div class="section-title"><div><p class="eyebrow">ACTIVITY</p><h2>学习热力图</h2></div><div class="legend">Less <i></i><i></i><i></i><i></i><i></i> More</div></div><div class="heat-scroll"><div id="heatmap" class="heatmap"></div></div><p class="hint">颜色按当天总学习时长分级：0、1–30、31–60、61–120、120+ 分钟。</p></section><div class="grid"><section class="panel"><p class="eyebrow">TRACKS</p><h2>学习主线</h2><div id="tracks"></div></section><section class="panel"><p class="eyebrow">THIS WEEK</p><h2>本周统计</h2><div class="week-grid"><div><span>总时长</span><b id="weekTotal">0m</b></div><div><span>日均</span><b id="dailyAvg">0m</b></div><div><span>学习天数</span><b id="studyDays">0</b></div><div><span>学习记录</span><b id="sessionCount">0</b></div></div></section></div><section class="panel"><p class="eyebrow">RECENT</p><h2>最近学习</h2><div id="recent" class="recent"></div></section><footer>Data from Learning OS · Updated <span id="updated">—</span></footer></main><script src="app.js"></script></body></html>
